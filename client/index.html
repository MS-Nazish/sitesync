    <title>SiteSync — Attendance & Payroll</title>
    <script>
      // Apply the saved language before React loads so Urdu pages don't flash left-to-right
      try {
        if (localStorage.getItem('sitesync_lang') === 'ur') {
          document.documentElement.lang = 'ur';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
